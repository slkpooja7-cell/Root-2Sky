<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Goal Tracker • root2sky</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* Autumn yellow theme */
    .goal-shell { max-width:960px; margin:48px auto; padding:34px; border-radius:20px; background:linear-gradient(180deg,#fffaf0,#fff7e6); box-shadow:0 24px 60px rgba(104,70,20,0.08); }
    .goal-header { display:flex; align-items:center; gap:18px; justify-content:space-between; flex-wrap:wrap }
    .goal-header h1{ margin:0; color:#6b3e00; font-size:3rem; font-weight:900; letter-spacing:-1px }
    .goal-header p{ margin:0; color:#8a5a1a; font-weight:700 }
    .goal-form { margin-top:22px; display:flex; gap:12px; flex-wrap:wrap; align-items:center }
    .sticky-note { margin-top:20px; padding:18px 22px; background:#fff5b8; border:2px solid #ffd66b; border-radius:18px; box-shadow: 0 16px 35px rgba(182,118,24,0.12); max-width:680px; font-size:1rem; color:#6a4d12; position:relative; }
    .sticky-note::before { content: ''; position:absolute; top:-10px; left:24px; width:64px; height:24px; background:#f7e187; border-radius:12px; box-shadow: inset 0 1px 0 rgba(255,255,255,0.7); }
    .sticky-note strong { display:block; font-size:1.05rem; margin-bottom:8px; }
    .sticky-note p { margin:0; line-height:1.7; color:#5f4a14; }
    .goal-form input[type="text"]{ flex:1; padding:14px 16px; border-radius:14px; border:1px solid #f0d8a8; background:#fffef8; font-size:1.05rem }
    .goal-form select, .goal-form input[type="date"]{ padding:10px 12px; border-radius:12px; border:1px solid #f1e0b8; background:#fff }
    .goal-form button{ padding:14px 20px; border-radius:14px; background:linear-gradient(135deg,#ffd57a,#ffb84d); border:none; color:#4b2b00; font-weight:900; font-size:1rem; cursor:pointer; box-shadow:0 10px 26px rgba(180,110,30,0.12) }
    .goals-grid{ display:grid; grid-template-columns:1fr 1fr; gap:18px; margin-top:22px }
    .goals-column{ background:linear-gradient(180deg,#fffdf6,#fff7e0); padding:16px; border-radius:14px; border:1px solid #f3e1be }
    .goals-column h2{ margin:0 0 8px; font-size:1.25rem; color:#5b3200 }
    #shortList, #longList{ margin-top:10px; list-style:none; padding:0 }
    .goal-item{ display:flex; align-items:center; gap:14px; padding:12px; border-radius:12px; background:linear-gradient(180deg,#fffdf7,#fff8ea); border:1px solid #f6e7c8; margin-bottom:12px }
    .goal-item .emoji{ font-size:26px }
    .goal-main{ flex:1 }
    .goal-text{ font-weight:900; color:#4a2b00; font-size:1.02rem }
    .goal-deadline{ font-size:0.9rem; color:#7a4f1a }
    .goal-actions button{ background:transparent; border:none; font-size:18px; cursor:pointer; padding:6px; border-radius:8px }
    .goal-item.done{ opacity:0.6; text-decoration:line-through }
    .empty{ color:#8b6a42; text-align:center; padding:18px }
    @media (max-width:880px){ .goals-grid{ grid-template-columns:1fr } .goal-header h1{ font-size:2.4rem } }
  </style>
</head>
<body>
  <div class="page-shell">
    <main class="goal-shell">
      <header class="goal-header">
        <div>
          <h1>Goal Tracker • Autumn 🌾</h1>
          <p>Add goals, set deadlines, complete or delete them — short & long term.</p>
        </div>
      </header>

      <div class="sticky-note">
        <strong>Hey there, goal getter!</strong>
        <p>Write down your next step and watch your small wins grow into big success. 🌟</p>
      </div>

      <div style="margin-top:18px; display:grid; gap:12px; max-width:720px;">
        <a href="freshers road map .html"><button type="button" style="width:100%; padding:12px 20px; border-radius:14px; border:none; background:linear-gradient(135deg,#ffd57a,#ffb84d); color:#4a2d04; font-weight:900; cursor:pointer;">Open Freshers Road Map 📚</button></a>
      </div>

      <form class="goal-form" id="goalForm">
        <input id="goalInput" type="text" placeholder="Add a new goal (e.g. finish assignment)" aria-label="Goal">
        <select id="categorySelect" aria-label="Category">
          <option value="short">Short-term 🍂</option>
          <option value="long">Long-term 🍁</option>
        </select>
        <input id="deadlineInput" type="date" aria-label="Deadline">
        <button id="addGoalBtn" type="submit">Add Goal ➕</button>
      </form>

      <div class="goals-grid">
        <section class="goals-column">
          <h2>Short-term Goals 🍂</h2>
          <ul id="shortList"></ul>
        </section>
        <section class="goals-column">
          <h2>Long-term Goals 🍁</h2>
          <ul id="longList"></ul>
        </section>
      </div>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
